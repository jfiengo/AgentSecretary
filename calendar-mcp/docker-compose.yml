version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calendar_mcp_postgres
    environment:
      POSTGRES_USER: calendar_user
      POSTGRES_PASSWORD: calendar_pass
      POSTGRES_DB: calendar_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_user -d calendar_mcp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

